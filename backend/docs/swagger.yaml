basePath: /api/v1
definitions:
  dto.AddMemberRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.CreateCommentRequest:
    properties:
      content:
        maxLength: 2000
        minLength: 1
        type: string
    required:
    - content
    type: object
  dto.CreateEpicRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      title:
        maxLength: 200
        minLength: 1
        type: string
    required:
    - title
    type: object
  dto.CreateLabelRequest:
    properties:
      color:
        type: string
      name:
        maxLength: 50
        minLength: 1
        type: string
    required:
    - name
    type: object
  dto.CreateMilestoneRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      dueDate:
        type: string
      title:
        maxLength: 200
        minLength: 1
        type: string
    required:
    - title
    type: object
  dto.CreateProjectRequest:
    properties:
      deadline:
        type: string
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 200
        minLength: 1
        type: string
    required:
    - name
    type: object
  dto.CreateSprintRequest:
    properties:
      endDate:
        type: string
      name:
        maxLength: 200
        minLength: 1
        type: string
      startDate:
        type: string
    required:
    - name
    type: object
  dto.CreateTaskRequest:
    properties:
      assigneeId:
        type: integer
      deadline:
        type: string
      description:
        maxLength: 1000
        type: string
      projectId:
        type: integer
      status:
        $ref: '#/definitions/model.TaskStatus'
      title:
        maxLength: 200
        minLength: 1
        type: string
    required:
    - title
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      message:
        type: string
      token:
        type: string
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      userName:
        minLength: 2
        type: string
    required:
    - email
    - password
    - userName
    type: object
  dto.TaskListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/model.Task'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  dto.UpdateEpicRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      title:
        maxLength: 200
        minLength: 1
        type: string
    type: object
  dto.UpdateMilestoneRequest:
    properties:
      description:
        maxLength: 1000
        type: string
      dueDate:
        type: string
      title:
        maxLength: 200
        minLength: 1
        type: string
    type: object
  dto.UpdateProjectRequest:
    properties:
      deadline:
        type: string
      description:
        maxLength: 1000
        type: string
      name:
        maxLength: 200
        minLength: 1
        type: string
    type: object
  dto.UpdateSprintRequest:
    properties:
      endDate:
        type: string
      name:
        maxLength: 200
        minLength: 1
        type: string
      startDate:
        type: string
      status:
        $ref: '#/definitions/model.SprintStatus'
    type: object
  dto.UpdateTaskRequest:
    properties:
      assigneeId:
        type: integer
      deadline:
        type: string
      description:
        maxLength: 1000
        type: string
      status:
        $ref: '#/definitions/model.TaskStatus'
      title:
        maxLength: 200
        minLength: 1
        type: string
    type: object
  model.Comment:
    properties:
      commentId:
        type: integer
      content:
        type: string
      createdAt:
        type: string
      taskId:
        type: integer
      updatedAt:
        type: string
      userId:
        type: integer
    type: object
  model.Epic:
    properties:
      createdAt:
        type: string
      description:
        type: string
      epicId:
        type: integer
      projectId:
        type: integer
      title:
        type: string
      updatedAt:
        type: string
    type: object
  model.Label:
    properties:
      color:
        type: string
      createdAt:
        type: string
      labelId:
        type: integer
      name:
        type: string
      projectId:
        type: integer
    type: object
  model.Milestone:
    properties:
      createdAt:
        type: string
      description:
        type: string
      dueDate:
        type: string
      milestoneId:
        type: integer
      projectId:
        type: integer
      title:
        type: string
      updatedAt:
        type: string
    type: object
  model.Project:
    properties:
      createdAt:
        type: string
      deadline:
        type: string
      description:
        type: string
      members:
        items:
          $ref: '#/definitions/model.ProjectMember'
        type: array
      name:
        type: string
      ownerId:
        type: integer
      projectId:
        type: integer
      tasks:
        items:
          $ref: '#/definitions/model.Task'
        type: array
      updatedAt:
        type: string
    type: object
  model.ProjectMember:
    properties:
      createdAt:
        type: string
      projectId:
        type: integer
      projectMemberId:
        type: integer
      role:
        $ref: '#/definitions/model.ProjectRole'
      user:
        $ref: '#/definitions/model.User'
      userId:
        type: integer
    type: object
  model.ProjectRole:
    enum:
    - owner
    - member
    type: string
    x-enum-varnames:
    - RoleOwner
    - RoleMember
  model.Sprint:
    properties:
      createdAt:
        type: string
      endDate:
        type: string
      name:
        type: string
      projectId:
        type: integer
      sprintId:
        type: integer
      startDate:
        type: string
      status:
        $ref: '#/definitions/model.SprintStatus'
      updatedAt:
        type: string
    type: object
  model.SprintStatus:
    enum:
    - planned
    - active
    - completed
    type: string
    x-enum-varnames:
    - SprintPlanned
    - SprintActive
    - SprintCompleted
  model.Task:
    properties:
      assigneeId:
        type: integer
      createdAt:
        type: string
      deadline:
        type: string
      description:
        type: string
      epicId:
        type: integer
      milestoneId:
        type: integer
      projectId:
        type: integer
      sprintId:
        type: integer
      status:
        $ref: '#/definitions/model.TaskStatus'
      taskId:
        type: integer
      title:
        type: string
      updatedAt:
        type: string
      userId:
        type: integer
    type: object
  model.TaskStatus:
    enum:
    - pending
    - in_progress
    - done
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusInProgress
    - StatusDone
  model.User:
    properties:
      createdAt:
        type: string
      email:
        type: string
      tasks:
        items:
          $ref: '#/definitions/model.Task'
        type: array
      updatedAt:
        type: string
      userId:
        type: integer
      userName:
        type: string
    type: object
host: localhost:3000
info:
  contact: {}
  description: REST API for a task management application with JWT authentication.
  title: Task Manager API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email and password, returns a JWT token
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: invalid credentials
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: too many requests
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log in
      tags:
      - auth
  /auth/me:
    get:
      description: Retrieve information about the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.User'
        "401":
          description: unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: user not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get current user info
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with a unique email and password
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: message and created user
          schema:
            additionalProperties: true
            type: object
        "400":
          description: validation error or email already taken
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - auth
  /comments/{commentId}:
    delete:
      description: Only the comment author can delete it
      parameters:
      - description: Comment ID
        in: path
        name: commentId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: not found or not the author
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a comment
      tags:
      - comments
  /epics/{epicId}:
    delete:
      description: Only the project owner can delete an epic
      parameters:
      - description: Epic ID
        in: path
        name: epicId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: not found, or not the owner
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete an epic
      tags:
      - epics
    put:
      consumes:
      - application/json
      parameters:
      - description: Epic ID
        in: path
        name: epicId
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateEpicRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Epic'
        "400":
          description: validation error, not found, or access denied
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update an epic
      tags:
      - epics
  /labels/{labelId}:
    delete:
      description: Only the project owner can delete a label
      parameters:
      - description: Label ID
        in: path
        name: labelId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a label
      tags:
      - labels
  /milestones/{milestoneId}:
    delete:
      description: Only the project owner can delete a milestone
      parameters:
      - description: Milestone ID
        in: path
        name: milestoneId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: not found, or not the owner
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a milestone
      tags:
      - milestones
    put:
      consumes:
      - application/json
      parameters:
      - description: Milestone ID
        in: path
        name: milestoneId
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateMilestoneRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Milestone'
        "400":
          description: validation error, not found, or access denied
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a milestone
      tags:
      - milestones
  /projects:
    get:
      description: Get all projects the authenticated user is a member or owner of
      produces:
      - application/json
      responses:
        "200":
          description: 'data: array of projects'
          schema:
            additionalProperties: true
            type: object
        "401":
          description: missing or invalid token
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List my projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Create a new project; the creator automatically becomes the project
        owner
      parameters:
      - description: Project payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Project'
        "400":
          description: validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: missing or invalid token
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a project
      tags:
      - projects
  /projects/{id}:
    delete:
      description: Delete a project; only the project owner can perform this action.
        Tasks in the project are unlinked, not deleted.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid id or not the owner
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: missing or invalid token
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete a project
      tags:
      - projects
    get:
      description: Get project details; the requester must be a member of the project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Project'
        "400":
          description: invalid id or access denied
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: missing or invalid token
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a project
      tags:
      - projects
    put:
      consumes:
      - application/json
      description: Update project details; only the project owner can perform this
        action
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Project'
        "400":
          description: validation error, invalid id, or not the owner
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: missing or invalid token
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a project
      tags:
      - projects
  /projects/{id}/epics:
    get:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'data: array of epics'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid id or access denied
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List epics in a project
      tags:
      - epics
    post:
      consumes:
      - application/json
      description: Create a new epic within a project; requester must be a project
        member
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Epic payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateEpicRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Epic'
        "400":
          description: validation error or access denied
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create an epic
      tags:
      - epics
  /projects/{id}/labels:
    get:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'data: array of labels'
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List project labels
      tags:
      - labels
    post:
      consumes:
      - application/json
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Label payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateLabelRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Label'
        "400":
          description: validation error or access denied
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a label
      tags:
      - labels
  /projects/{id}/members:
    get:
      description: Get all members of a project; the requester must be a member of
        the project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'data: array of members'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid id or access denied
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: missing or invalid token
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List project members
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Add a user to the project by email; only the project owner can
        perform this action
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Member email
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AddMemberRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.ProjectMember'
        "400":
          description: validation error, not the owner, user not found, or already
            a member
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: missing or invalid token
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Add a project member
      tags:
      - projects
  /projects/{id}/members/{userId}:
    delete:
      description: Remove a member from the project; only the project owner can perform
        this action. The owner cannot be removed.
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: User ID to remove
        in: path
        name: userId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: message
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: invalid id, not the owner, or attempting to remove the owner
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: missing or invalid token
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Remove a project member
      tags:
      - projects
  /projects/{id}/milestones:
    get:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'data: array of milestones'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid id or access denied
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List milestones in a project
      tags:
      - milestones
    post:
      consumes:
      - application/json
      description: Create a new milestone within a project; requester must be a project
        member
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Milestone payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateMilestoneRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Milestone'
        "400":
          description: validation error or access denied
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a milestone
      tags:
      - milestones
  /projects/{id}/sprints:
    get:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 'data: array of sprints'
          schema:
            additionalProperties: true
            type: object
        "400":
          description: invalid id or access denied
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List sprints in a project
      tags:
      - sprints
    post:
      consumes:
      - application/json
      description: Create a new sprint within a project; requester must be a project
        member
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: integer
      - description: Sprint payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateSprintRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Sprint'
        "400":
          description: validation error or access denied
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a sprint
      tags:
      - sprints
  /projects/{id}/tasks:
    get:
      description: Get a paginated list of tasks belonging to a project; the requester
        must be a member of the project
